<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Suhyeok Han|UI Programming Design 1</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── INTRO ── */
    #intro {
      position: fixed; inset: 0; z-index: 300;
      background: #fff;
      overflow: hidden;
    }
    #intro-img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
    }
    /* white tile mask on top */
    #mosaic-canvas {
      position: absolute; inset: 0; pointer-events: none;
    }
    #intro-hint {
      position: absolute; bottom: 40px; left: 50%;
      transform: translateX(-50%);
      font-size: 0.55rem; letter-spacing: 0.28em;
      text-transform: uppercase; color: rgba(10,10,10,0.4);
      white-space: nowrap;
      animation: blink 2s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:.3} 50%{opacity:.9} }
    #intro.done { opacity: 0; transition: opacity 0.6s ease; pointer-events: none; }

    /* ── MAIN ── */
    #main {
      padding-top: calc(var(--nav-h) + 0px);
      opacity: 0; transition: opacity 0.6s ease 0.1s;
    }
    #main.visible { opacity: 1; }

    /* ── FULL IMAGE HERO ── */
    .hero {
      width: 100%; position: relative;
      margin-bottom: 2px;
    }
    .hero img, .hero .img-ph {
      width: 100%; display: block;
    }
    .hero-item {
      position: relative; overflow: hidden;
    }
    .hero-item img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.7s cubic-bezier(.25,.46,.45,.94);
    }
    .hero-item:hover img { transform: scale(1.02); }

    /* Two-column hero like AD */
    .hero-duo {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
      margin-bottom: 2px;
    }
    .hero-duo .hero-item { aspect-ratio: 3/4; }

    /* Single full-width */
    .hero-single .hero-item { aspect-ratio: 16/7; }

    .hero-caption {
      position: absolute;
      bottom: 32px; left: 32px;
    }
    .hero-caption h2 {
      font-size: 0.65rem;
      font-weight: 300;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #fff;
      margin-bottom: 10px;
    }
    .hero-caption a {
      font-size: 0.55rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #fff;
      border-bottom: 1px solid rgba(255,255,255,0.5);
      padding-bottom: 2px;
      transition: border-color 0.2s;
    }
    .hero-caption a:hover { border-color: #fff; }

    /* Image placeholder */
    .img-ph {
      background: #f0efec;
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 100%;
    }
    .img-ph span {
      font-size: 0.5rem; letter-spacing: 0.2em;
      text-transform: uppercase; color: #bbb;
    }

    /* ── GRID (below hero) ── */
    .home-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      margin-bottom: 2px;
    }
    .home-grid .grid-item {
      position: relative; overflow: hidden;
      aspect-ratio: 3/4;
    }
    .home-grid .grid-item img,
    .home-grid .grid-item .img-ph {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.6s cubic-bezier(.25,.46,.45,.94);
    }
    .home-grid .grid-item:hover img { transform: scale(1.03); }

    @media (max-width: 600px) {
      .hero-duo { grid-template-columns: 1fr; }
      .home-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<!-- Header -->
<header id="site-header">
  <h1><a href="index.html">Suhyeok Han</a></h1>
  <nav>
    <a href="ui-programming-design.html">UI Programming Design</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="about.html">About Me</a>
  </nav>
</header>

<!-- Intro mosaic overlay -->
<div id="intro">
  <img id="intro-img"
    src="images/intro.JPG"
    alt="SUHYEOKHAN2025L2"/>
  <canvas id="mosaic-canvas"></canvas>
  <p id="intro-hint">hover to reveal &nbsp;·&nbsp; click to enter</p>
</div>

<!-- Main content -->
<main id="main">

  <!-- Two-up hero -->
  <div class="hero-duo">
    <div class="hero-item" style="aspect-ratio:3/4">
      <img src="images/MAIN1.JPG" alt="MAIN 1"/>
    </div>
    <div class="hero-item" style="aspect-ratio:3/4">
      <img src="images/MAIN2.JPG" alt="MAIN 2"/>
    </div>
  </div>

  <!-- Full-width -->
  <div class="hero-single" style="margin-bottom:2px;">
        <div class="hero-item" style="aspect-ratio:16/7">
      <img src="images/FULLWIDTH1.jpeg" alt="Full Width1"/>
    </div>
  </div>

  <!-- Three-col grid -->
  <div class="home-grid">
    <div class="grid-item"><img src="images/MAIN3.JPG" alt="MAIN 3"/></div>
    <div class="grid-item"><img src="images/MAIN4.JPG" alt="MAIN 4"/></div>
    <div class="grid-item"><img src="images/MAIN5.JPG" alt="MAIN 5"/></div>
  </div>

</main>

<script src="main.js"></script>
<script>
  const intro = document.getElementById('intro');
  const introImg = document.getElementById('intro-img');
  const canvas = document.getElementById('mosaic-canvas');
  const ctx = canvas.getContext('2d');
  const TILE = 28;
  const revealed = new Set();
  let totalTiles = 0, ready = false;

  function resize() {
    canvas.width = window.innerWidth; canvas.height = window.innerHeight; drawMask();
  }
  function drawMask() {
    const cols = Math.ceil(canvas.width/TILE), rows = Math.ceil(canvas.height/TILE);
    totalTiles = cols * rows;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#ffffff';
    for (let r=0;r<rows;r++) for (let c=0;c<cols;c++)
      if (!revealed.has(`${c},${r}`)) ctx.fillRect(c*TILE, r*TILE, TILE, TILE);
  }
  introImg.addEventListener('load', () => { ready=true; resize(); });
  if (introImg.complete) { ready=true; resize(); }
  window.addEventListener('resize', resize);

  intro.addEventListener('mousemove', e => {
    if (!ready) return;
    const col=Math.floor(e.clientX/TILE), row=Math.floor(e.clientY/TILE);
    for (let dr=-2;dr<=2;dr++) for (let dc=-2;dc<=2;dc++) {
      const key=`${col+dc},${row+dr}`;
      if (!revealed.has(key)) { revealed.add(key); ctx.clearRect((col+dc)*TILE,(row+dr)*TILE,TILE,TILE); }
    }
    if (revealed.size > totalTiles*0.32) enterSite();
  });
  intro.addEventListener('click', enterSite);

  function enterSite() {
    if (intro.classList.contains('done')) return;
    intro.classList.add('done');
    setTimeout(() => { intro.style.display='none'; document.getElementById('main').classList.add('visible'); }, 600);
  }
</script>
</body>
</html>
